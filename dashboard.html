<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <title>Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg bg-body-tertiary mb-4 shadow-sm">
        <div class="container-fluid">
            <a class="navbar-brand text-primary fw-bold" href="#">SecureApp</a>
            <div class="navbar-nav">
                <a class="nav-link active" href="/dashboard">Dashboard</a>
                <a class="nav-link" href="/profile">My Profile</a>
                <a class="nav-link text-danger" href="/admin">Admin Panel</a>
            </div>
            <a class="btn btn-outline-danger btn-sm ms-auto" href="/logout">Logout</a>
        </div>
    </nav>

    <div class="container">
        <div class="card shadow">
            <div class="card-body">
                <h2 class="card-title">Welcome, {{ session.username }}!</h2>
                <p class="card-text">Current Access Level: <span class="badge bg-info text-dark">{{ session.role }}</span></p>
                
                <h4 class="mt-4">Your Orders</h4>
                <ul class="list-group mt-3">
                    {% for order in orders %}
                        <li class="list-group-item d-flex justify-content-between align-items-center">
                            <a href="/order/{{ order.id }}" class="text-decoration-none">{{ order.item }}</a>
                            <span class="badge bg-success rounded-pill">${{ order.amount }}</span>
                        </li>
                    {% endfor %}
                </ul>
            </div>
        </div>
    </div>
</body>
</html>
