<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <title>Login - SecureApp</title>
    <!-- This one line imports a professional UI framework (Bootstrap) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="d-flex align-items-center py-4 bg-body-tertiary" style="height: 100vh;">
    <main class="form-signin w-100 m-auto" style="max-width: 400px; padding: 15px;">
        <form method="POST" class="card p-4 shadow">
            <h1 class="h3 mb-3 fw-normal text-center">System Login</h1>
            
            {% if error %}<div class="alert alert-danger">{{ error }}</div>{% endif %}
            
            <div class="form-floating mb-2">
                <input type="text" class="form-control" name="username" placeholder="Username" required>
                <label>Username</label>
            </div>
            <div class="form-floating mb-3">
                <input type="password" class="form-control" name="password" placeholder="Password" required>
                <label>Password</label>
            </div>
            <button class="btn btn-primary w-100 py-2" type="submit">Authenticate</button>
            <p class="mt-3 mb-0 text-body-secondary text-center small">Hint: alice / alice123</p>
        </form>
    </main>
</body>
</html>
